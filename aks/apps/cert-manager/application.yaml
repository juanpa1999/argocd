# cert-manager (chart upstream jetstack, versión fija) + global-values + ./values.yaml.
# Wave -3: operador con CRDs; tiene que estar Healthy antes de cluster-issuers (-2)
# y del Certificate del chart ingress (3).
# name == releaseName == "cert-manager" (el mismo nombre del helm_release que
# tenía Terraform): así ArgoCD adopta los recursos que ya existen sin recrearlos.
# Sin finalizer resources-finalizer: borrar esta Application NO desinstala
# cert-manager ni sus CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.3
      helm:
        releaseName: cert-manager
        valueFiles:
          - $values/aks/global-values.yaml
          - $values/aks/apps/cert-manager/values.yaml
    - repoURL: https://github.com/juanpa1999/argocd.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Las CRDs superan el límite de 256 KB de la anotación last-applied del apply clásico.
      - ServerSideApply=true
